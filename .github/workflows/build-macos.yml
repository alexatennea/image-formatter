name: Build macOS app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 rather than the newest CPython -- PyInstaller and the
          # rapidocr-onnxruntime wheel tend to lag the latest release. The
          # python.org build actions/setup-python installs on macOS bundles
          # its own Tcl/Tk, so tkinter works without a separate brew step.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter OK, Tk', tkinter.TkVersion)"

      - name: Run tests
        run: pytest tests/ -q

      - name: Build app bundle
        run: |
          pyinstaller --onefile --windowed --name ImageRenamer \
            --collect-data rapidocr_onnxruntime \
            --paths . \
            image_renamer/app.py

      - name: Package
        # ditto (not zip) preserves the .app bundle structure correctly.
        run: ditto -c -k --sequesterRsrc --keepParent dist/ImageRenamer.app ImageRenamer-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ImageRenamer-mac
          path: ImageRenamer-mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageRenamer-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

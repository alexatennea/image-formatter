name: Build macOS app

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 rather than the newest CPython -- PyInstaller and the
          # rapidocr-onnxruntime wheel tend to lag the latest release. The
          # python.org build actions/setup-python installs on macOS bundles
          # its own Tcl/Tk, so tkinter works without a separate brew step.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter OK, Tk', tkinter.TkVersion)"

      - name: Run tests
        # `python -m pytest` (not the bare `pytest` console script) so the
        # repo root lands on sys.path and `image_renamer` is importable --
        # tests/ has no __init__.py, so pytest's own rootless import
        # doesn't add the repo root the way `-m` does.
        run: python -m pytest tests/ -q

      - name: Build app bundle
        run: |
          pyinstaller --onefile --windowed --name ImageRenamer \
            --collect-data rapidocr_onnxruntime \
            --paths . \
            image_renamer/app.py

      # Upload the raw .app bundle, not a zip of it: actions/upload-artifact
      # already wraps whatever it's given in its own zip on download, so
      # zipping the bundle ourselves first produced a zip-inside-a-zip that
      # confused Archive Utility on extraction (extracting the GitHub
      # wrapper just dropped our already-zipped file into Downloads,
      # colliding with any earlier download and needing a second manual
      # extraction). actions/upload-artifact preserves directory structure
      # and permissions in its own zip, so this still reconstructs a
      # working .app on download -- one extraction, done.
      - uses: actions/upload-artifact@v4
        with:
          name: ImageRenamer-mac
          path: dist/ImageRenamer.app

      - name: Package for release
        # A GitHub Release asset has to be a single file, so the .app
        # (a directory) needs zipping here -- but only here, for the
        # release upload, not for the workflow artifact above. ditto
        # (rather than the `zip` command) preserves the bundle's resource
        # forks and metadata correctly.
        if: startsWith(github.ref, 'refs/tags/')
        run: ditto -c -k --sequesterRsrc --keepParent dist/ImageRenamer.app ImageRenamer-mac.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageRenamer-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Workflow artifacts (unlike Release assets) pile up forever
      # otherwise -- every push to main uploads a new one under the same
      # name, so keep only the 3 most recent and delete the rest.
      - name: Prune old artifacts (keep newest 3)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = "ImageRenamer-mac";
            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const matching = all
              .filter((a) => a.name === artifactName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of matching.slice(3)) {
              console.log(`Deleting old artifact ${artifact.id} (${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id,
              });
            }

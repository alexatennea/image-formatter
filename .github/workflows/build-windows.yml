name: Build Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 rather than the newest CPython -- PyInstaller and the
          # rapidocr-onnxruntime wheel tend to lag the latest release.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name ImageRenamer `
            --collect-data rapidocr_onnxruntime `
            --paths . `
            image_renamer/app.py

      - name: Package
        run: Compress-Archive -Path dist/ImageRenamer.exe -DestinationPath ImageRenamer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ImageRenamer-windows
          path: ImageRenamer-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ImageRenamer-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

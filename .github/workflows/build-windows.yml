name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    # Scopes the GitHub OIDC token's subject to
    # "repo:alexatennea/image-formatter:environment:release" regardless of
    # which ref triggered the run (push to main, any version tag, or a
    # manual dispatch) -- Azure federated credentials need an exact subject
    # match with no wildcards, and tag names vary per release, so an
    # environment (rather than a per-branch/per-tag credential) is what
    # lets one federated credential cover all of them.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 rather than the newest CPython -- PyInstaller and the
          # rapidocr-onnxruntime wheel tend to lag the latest release.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `python -m pytest` (not the bare `pytest` console script) so the
        # repo root lands on sys.path and `image_renamer` is importable --
        # tests/ has no __init__.py, so pytest's own rootless import
        # doesn't add the repo root the way `-m` does.
        run: python -m pytest tests/ -q

      - name: Build executable
        # No --onefile: a real-world report from an actual operator machine
        # showed OCR output degrading into near-random characters (digits,
        # symbols, even stray CJK glyphs) -- the character-dictionary
        # mapping code was checked and is fine (explicit UTF-8 decode), so
        # this points to the bundled ~100MB of ONNX model weights
        # themselves getting corrupted. --onefile self-extracts that
        # payload to a fresh temp folder on every single launch, which on
        # Windows is exposed to legacy MAX_PATH truncation, antivirus
        # interference during unpack, and general flakiness that --onedir
        # (a plain directory run in place, no runtime unpacking) avoids
        # entirely -- matching the same tradeoff already made for macOS.
        run: |
          pyinstaller --windowed --name ImageRenamer `
            --icon assets/icon.ico `
            --collect-data rapidocr_onnxruntime `
            --paths . `
            image_renamer/app.py

      - name: Azure login (OIDC)
        # azure/trusted-signing-action doesn't perform the GitHub OIDC
        # token exchange itself -- it authenticates via .NET's
        # DefaultAzureCredential, which only picks up a federated identity
        # from the environment/token-cache a prior login step leaves
        # behind. Without this step it fell through Environment,
        # WorkloadIdentity and ManagedIdentity credentials and failed with
        # "Identity not found". No client-secret here: azure/login uses
        # OIDC automatically given `id-token: write` permission (above)
        # and no secret input.
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign app executable (Azure Trusted Signing)
        uses: azure/trusted-signing-action@v0.5.1
        with:
          # This job's `environment: release` (above) is what makes the
          # OIDC token's subject match the federated credential configured
          # on the Entra ID app
          # (repo:alexatennea/image-formatter:environment:release).
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: ennealimited
          certificate-profile-name: ennea
          files-folder: ${{ github.workspace }}\dist\ImageRenamer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Determine installer version
        id: version
        # Tags look like v1.2.3 -- Inno Setup wants just 1.2.3. Anything
        # else (a push to main, a manual run) has no real version number,
        # so use the run number to keep it unique and traceable instead.
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-dev.${{ github.run_number }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        # Wraps the signed --onedir payload into one installer .exe
        # (Program Files install + Start Menu shortcut) via Inno Setup --
        # this is what lets Windows users get "one file" to run/share
        # without going back to PyInstaller's --onefile mode, which
        # re-extracts its payload to a fresh temp folder on every launch
        # (the likely cause of the OCR-corruption bug fixed by switching
        # to --onedir in the first place).
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer\windows.iss

      - name: Sign installer (Azure Trusted Signing)
        # The installer is a separate binary from the app .exe inside it,
        # and SmartScreen/Authenticode evaluate each file's signature
        # independently -- signing only the inner app .exe would still
        # leave the installer itself showing as unsigned/untrusted the
        # moment someone double-clicks it to install.
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: ennealimited
          certificate-profile-name: ennea
          files-folder: ${{ github.workspace }}\installer\output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: ImageRenamer-windows
          path: installer/output/ImageRenamerSetup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/ImageRenamerSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Workflow artifacts (unlike Release assets) pile up forever
      # otherwise -- every push to main uploads a new one under the same
      # name, so keep only the 3 most recent and delete the rest.
      - name: Prune old artifacts (keep newest 3)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = "ImageRenamer-windows";
            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const matching = all
              .filter((a) => a.name === artifactName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of matching.slice(3)) {
              console.log(`Deleting old artifact ${artifact.id} (${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id,
              });
            }

name: Build Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 rather than the newest CPython -- PyInstaller and the
          # rapidocr-onnxruntime wheel tend to lag the latest release.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # `python -m pytest` (not the bare `pytest` console script) so the
        # repo root lands on sys.path and `image_renamer` is importable --
        # tests/ has no __init__.py, so pytest's own rootless import
        # doesn't add the repo root the way `-m` does.
        run: python -m pytest tests/ -q

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name ImageRenamer `
            --collect-data rapidocr_onnxruntime `
            --paths . `
            image_renamer/app.py

      # Upload the raw .exe, not a zip of it: actions/upload-artifact
      # already wraps whatever it's given in its own zip on download, so
      # zipping it ourselves first produced a zip-inside-a-zip that
      # confused Archive Utility on extraction. A bare .exe is also a
      # perfectly valid GitHub Release asset, so no zip is needed there
      # either.
      - uses: actions/upload-artifact@v4
        with:
          name: ImageRenamer-windows
          path: dist/ImageRenamer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImageRenamer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
